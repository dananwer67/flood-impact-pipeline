services:
  db:
    image: postgis/postgis:16-3.4
    container_name: flood_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - flood_pgdata:/var/lib/postgresql/data

volumes:
  flood_pgdata:
